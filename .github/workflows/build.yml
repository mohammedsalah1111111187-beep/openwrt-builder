name: Build OpenWrt

on:
  repository_dispatch:
    types: [build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install tools
      run: sudo apt update && sudo apt install -y jq wget tar

    - name: Run build
      run: bash build.sh

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: output/
